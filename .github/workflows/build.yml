name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: PDF-Master-mac
            files: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            platform: win
            artifact: PDF-Master-win
            files: |
              release/*.exe
          - os: ubuntu-latest
            platform: linux
            artifact: PDF-Master-linux
            files: |
              release/*.deb
              release/*.AppImage

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Linux 打包依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libgtk-3-0 \
            libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建前端 + 打包 Electron 应用
        env:
          # tag 触发时让 electron-builder 直接发布到 GitHub Release
          # （上传产物 + latest.yml / mac.yml / win.yml / linux.yml，供 auto-updater 使用）
          # workflow_dispatch 手动触发时仅打包，不发布
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            npm run electron:build:${{ matrix.platform }} -- --publish always
          else
            npm run electron:build:${{ matrix.platform }} -- --publish never
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
